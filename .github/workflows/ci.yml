name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (warnings and errors fail the build)
        run: shellcheck -S warning bin/*.sh hooks/*.sh tools/*.sh tests/*.sh
      - name: smoke test (throwaway board in a temp dir)
        run: bash tests/smoke.sh
  # macOS runs on pull requests and on main, not on other branch pushes (its minutes bill 10x Linux)
  macos:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: smoke test (throwaway board in a temp dir)
        run: bash tests/smoke.sh
